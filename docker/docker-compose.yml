name: personal-health-agent-app

services:
  db:
    image: pgvector/pgvector:pg16
    # 容器名在 Docker 守护进程内全局唯一，必须加项目前缀，
    # 否则会与同机上其他项目的同名容器冲突。
    container_name: personal-health-agent-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: pha
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: pha
    ports:
      # 宿主机 5432 映射到容器 5432。若宿主机已自带 PostgreSQL 占用 5432，
      # 改为 "5433:5432"，并同步修改应用侧连接端口。
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      # 仅在数据卷首次初始化时执行。
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pha -d pha"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: personal-health-agent-redis
    restart: unless-stopped
    command: redis-server --requirepass 123456
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # 密码必须与上方 --requirepass 保持一致，否则容器长期 unhealthy。
      test: ["CMD-SHELL", "redis-cli -a 123456 --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  backend:
    build:
      # 构建上下文是后端目录，Dockerfile 与 .dockerignore 都在那里。
      context: ../agent-app
    container_name: personal-health-agent-backend
    restart: unless-stopped
    # .env 里放着真实 LLM_API_KEY，只在运行时注入容器，不进镜像也不进仓库。
    # required: false 是为了在只有 .env.example 的新环境里仍能 up 起来。
    env_file:
      - path: ../agent-app/.env
        required: false
    environment:
      # 容器里不能用 localhost：那指向容器自己，必须用 compose 服务名。
      DATABASE_URL: postgresql+psycopg://pha:123456@db:5432/pha
      REDIS_URL: redis://:123456@redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      # 开发模式：只挂源码，改代码后 uvicorn reload 自动生效，不用重建镜像。
      # 绝不能挂整个 ../agent-app，否则宿主机的 Windows .venv 会覆盖容器内
      # 的 Linux 虚拟环境，依赖全套失效。
      - ../agent-app/src:/app/src
      # 上传的文件按 {user_id}/{file_id}.{ext} 落在 upload_dir（容器内 /app/uploads）。
      # 不挂到宿主机的话，容器一重建上传的文件就全没了。
      - ../agent-app/uploads:/app/uploads
      # DS 子 Agent 的代码执行沙箱靠它启动。挂进容器等于把宿主 Docker 守护进程的
      # 控制权交给 backend：能起特权容器、能挂宿主根目录。接受这个风险的依据是三条：
      # 写 socket 的是 backend 的代码，不是沙箱里模型生成的代码（沙箱自己不挂
      # socket、--network none、不挂任何宿主路径）；backend 唯一的不可信输入是上传
      # 的 PDF / 图片，走本地解析、不执行其中的代码；沙箱镜像是本仓库的
      # docker/sandbox/Dockerfile，不是任意外部镜像。
      # 要收回它只需换掉 agent_app/ds/docker_executor.py，ds/ 其余部分一行不用改。
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 建表（alembic upgrade head）不属于当前功能，迁移仍需手动执行。
    command: ["uv", "run", "--no-sync", "agent-app"]

  # 沙箱镜像不是常驻服务，列在这里只是让「这个镜像属于本项目」有唯一出处。
  # 构建：docker compose --profile sandbox build sandbox
  # 镜像名必须与 agent_app/config.py 里 ds_sandbox_image 的默认值一致，
  # 否则 backend 会在第一次分析时找不到镜像。
  sandbox:
    profiles: ["sandbox"]
    build:
      context: ./sandbox
    image: pha-ds-sandbox:0.1.0
    # 只用来构建，不需要启动。
    command: ["true"]

volumes:
  pgvector_data:
  redis_data:
